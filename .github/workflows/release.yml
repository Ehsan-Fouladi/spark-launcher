name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }  # اگر خطا داد، stop کن

      - name: Check what was built
        run: |
          echo "Looking for exe files..."
          Get-ChildItem -Path target/release -Filter *.exe -Recurse
          echo "---"
          Get-ChildItem target/release/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}