name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release
        # اگر اینجا خطا بده، workflow خودکار stop می‌شود

      - name: Verify build output
        run: |
          $exe = "target/release/spark_launcher.exe"
          if (Test-Path $exe) {
            echo "✅ Found: $exe"
            echo "Size: $((Get-Item $exe).Length) bytes"
          } else {
            echo "❌ Build failed! File not found: $exe"
            echo "Contents of target/release/:"
            Get-ChildItem target/release/
            exit 1
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/spark_launcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}