name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exe = Get-ChildItem -Path target -Recurse -Filter "*.exe" | Where-Object { $_.FullName -match "release" } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No release .exe found!"
            exit 1
          }
          Copy-Item $exe.FullName -Destination "dist/spark_launcher.exe"
          Compress-Archive -Path "dist/spark_launcher.exe" -DestinationPath "spark_launcher-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spark_launcher.exe
            spark_launcher-windows-x64.zip
          generate_release_notes: true